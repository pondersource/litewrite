name: Deploy

# Publishes the live site at litewrite.pondersource.com on every push to main, and can
# also be run manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: litewrite-pages

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
      - run: npm run build:atomic
      - run: shasum -a 384 -c scripts/atomic-release.sha384


      - uses: actions/checkout@v4
        with:
          repository: pondersource/remotestorage.js
          ref: 607acc5a474c28e08ca3836de71d20c9bdff7ca1
          path: atomic-storage-source
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ontola/atomic-server
          ref: fb640fb54657ef826db8ec7ca55e24587faab1da
          path: atomic-sdk-source
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: atomic-sdk-source/browser/package.json

      - run: pnpm install --frozen-lockfile && pnpm --filter @tomic/utils build
        working-directory: atomic-sdk-source/browser

      - run: node atomic-storage-source/scripts/build-atomic-sdk.mjs atomic-sdk-source atomic-sdk

      - name: Assemble site
        # Copy only the files the live site needs into a clean directory.
        # Building straight from the repo checkout doesn't work here: that
        # checkout's own .gitignore lists litewrite.min.js/service-worker.js
        # (they're build artifacts, not committed), and actions-gh-pages
        # respects that .gitignore when it copies publish_dir, so the exact
        # files we want published get silently dropped.
        run: |
          rm -rf site
          mkdir site
          cp index.html litewrite.min.js litewrite.min.js.LICENSE.txt service-worker.js workbox-*.js CNAME site/
          cp -r img style atomic-sdk site/
          # Preserve immutable bundle URLs from earlier Pages releases.
          git fetch --depth=1 origin gh-pages
          if git cat-file -e FETCH_HEAD:atomic; then
            git archive FETCH_HEAD atomic | tar -x -C site
          fi
          mkdir -p site/atomic
          for bundle in atomic/litewrite-*.js; do
            if [ -f "site/$bundle" ]; then
              cmp "$bundle" "site/$bundle"
            else
              cp "$bundle" "site/$bundle"
            fi
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
